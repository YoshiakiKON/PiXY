<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1328" height="531" viewBox="0 0 1328 531">
  <style> .box{fill:#f4f6f8;stroke:#2b2b2b;stroke-width:2;} .txt{font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#111}</style>
  <rect x="30" y="200" width="220" height="120" class="box" rx="8"/>
  <text x="140" y="265" text-anchor="middle" class="txt">Microscope image</text>

  <rect x="300" y="200" width="220" height="120" class="box" rx="8"/>
  <text x="410" y="245" text-anchor="middle" class="txt">K-means +</text>
  <text x="410" y="275" text-anchor="middle" class="txt">centroid extraction</text>

  <rect x="570" y="200" width="220" height="120" class="box" rx="8"/>
  <text x="680" y="265" text-anchor="middle" class="txt">Fiducial entry</text>

  <rect x="840" y="200" width="220" height="120" class="box" rx="8"/>
  <text x="950" y="245" text-anchor="middle" class="txt">Least-squares</text>
  <text x="950" y="275" text-anchor="middle" class="txt">affine mapping</text>

  <rect x="1110" y="200" width="160" height="120" class="box" rx="8"/>
  <text x="1190" y="265" text-anchor="middle" class="txt">Stage coords</text>

  <!-- arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b" />
    </marker>
  </defs>
  <line x1="250" y1="260" x2="300" y2="260" stroke="#2b2b2b" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="520" y1="260" x2="570" y2="260" stroke="#2b2b2b" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="790" y1="260" x2="840" y2="260" stroke="#2b2b2b" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="1060" y1="260" x2="1110" y2="260" stroke="#2b2b2b" stroke-width="3" marker-end="url(#arrow)" />

  <text x="664" y="140" class="txt" text-anchor="middle" font-size="18">PiXY workflow: prepare coordinates offline → import to instrument</text>
</svg>