<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #111827; stroke-width: 2; rx: 14; }
      .title { font: 700 20px Arial, sans-serif; fill: #111827; }
      .text { font: 16px Arial, sans-serif; fill: #111827; }
      .note { font: 14px Arial, sans-serif; fill: #374151; }
      .arrow { stroke: #111827; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .badge { fill: #0b3d91; }
      .badgeText { font: 700 14px Arial, sans-serif; fill: #ffffff; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#111827" />
    </marker>
  </defs>

  <!-- Column headers -->
  <rect x="55" y="30" width="120" height="30" class="badge" rx="8" />
  <text x="115" y="51" text-anchor="middle" class="badgeText">Inputs</text>

  <rect x="535" y="30" width="120" height="30" class="badge" rx="8" />
  <text x="595" y="51" text-anchor="middle" class="badgeText">PiXY</text>

  <rect x="1005" y="30" width="140" height="30" class="badge" rx="8" />
  <text x="1075" y="51" text-anchor="middle" class="badgeText">Outputs</text>

  <!-- Input: Microscopy image -->
  <rect x="40" y="90" width="360" height="120" class="box" />
  <text x="60" y="125" class="title">Microscopy image</text>
  <text x="60" y="155" class="text">BSE / optical image</text>
  <text x="60" y="180" class="note">(e.g., resin mount)</text>

  <!-- PiXY: Particle detection -->
  <rect x="420" y="90" width="360" height="120" class="box" />
  <text x="440" y="125" class="title">Particle detection</text>
  <text x="440" y="155" class="text">Centroids (u, v)</text>
  <text x="440" y="180" class="note">K-means + connected components</text>

  <!-- Input: Reference points -->
  <rect x="40" y="250" width="360" height="150" class="box" />
  <text x="60" y="285" class="title">Reference points</text>
  <text x="60" y="315" class="text">Image points ↔ Stage points</text>
  <text x="60" y="345" class="note">Select distinctive features on image</text>
  <text x="60" y="370" class="note">Measure corresponding (X, Y, Z) on instrument</text>

  <!-- PiXY: Coordinate transformation -->
  <rect x="420" y="250" width="360" height="150" class="box" />
  <text x="440" y="285" class="title">Coordinate transformation</text>
  <text x="440" y="315" class="text">2D → 3D affine mapping</text>
  <text x="440" y="345" class="note">Least squares fit from reference pairs</text>
  <text x="440" y="370" class="note">Residual inspection & orientation adjustment</text>

  <!-- Output: Stage coordinate list -->
  <rect x="800" y="170" width="360" height="150" class="box" />
  <text x="820" y="205" class="title">Stage coordinate list</text>
  <text x="820" y="235" class="text">(X, Y, Z) for targets</text>
  <text x="820" y="265" class="note">Export CSV / copy to clipboard</text>
  <text x="820" y="290" class="note">→ instrument software for targeting</text>

  <!-- Arrows -->
  <path d="M 400 150 L 420 150" class="arrow" />
  <path d="M 220 210 L 220 250" class="arrow" />
  <path d="M 400 325 L 420 325" class="arrow" />
  <path d="M 780 150 L 800 225" class="arrow" />
  <path d="M 780 325 L 800 245" class="arrow" />
</svg>
