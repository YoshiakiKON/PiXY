<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560">
  <defs>
    <style>
      .bg { fill:#ffffff; }
      .box { fill:#ffffff; stroke:#111827; stroke-width:2; rx:14; }
      .step { fill:#0b3d91; }
      .stepText { font:700 16px Arial, sans-serif; fill:#ffffff; }
      .title { font:700 20px Arial, sans-serif; fill:#111827; }
      .text { font:16px Arial, sans-serif; fill:#111827; }
      .note { font:14px Arial, sans-serif; fill:#374151; }
      .arrow { stroke:#111827; stroke-width:2.5; fill:none; marker-end:url(#arrowhead); }
      .dashed { stroke:#6b7280; stroke-width:2; fill:none; stroke-dasharray:6 6; }
      .chip { fill:#e5e7eb; }
      .chipText { font:700 13px Arial, sans-serif; fill:#111827; }
      .mono { font: 14px "Consolas", "Courier New", monospace; fill:#111827; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#111827" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="560" />

  <!-- Two lanes -->
  <rect x="40" y="70" width="560" height="440" class="dashed" rx="18" />
  <rect x="680" y="70" width="560" height="440" class="dashed" rx="18" />

  <rect x="60" y="35" width="170" height="30" class="chip" rx="10" />
  <text x="145" y="56" text-anchor="middle" class="chipText">Image space</text>

  <rect x="700" y="35" width="220" height="30" class="chip" rx="10" />
  <text x="810" y="56" text-anchor="middle" class="chipText">Instrument stage space</text>

  <!-- Step 1: Open image -->
  <rect x="70" y="100" width="500" height="90" class="box" />
  <rect x="90" y="120" width="34" height="34" class="step" rx="8" />
  <text x="107" y="143" text-anchor="middle" class="stepText">1</text>
  <text x="140" y="132" class="title">Open microscopy image</text>
  <text x="140" y="158" class="text">BSE / optical image</text>
  <text x="140" y="182" class="note">PiXY: “Open Image”</text>

  <!-- Step 2: Detect centroids -->
  <rect x="70" y="215" width="500" height="115" class="box" />
  <rect x="90" y="235" width="34" height="34" class="step" rx="8" />
  <text x="107" y="258" text-anchor="middle" class="stepText">2</text>
  <text x="140" y="247" class="title">Detect particles & centroids</text>
  <text x="140" y="273" class="text">Centroids in image coords: (u, v)</text>
  <text x="140" y="297" class="note">K-means + connected components (or import pre-processed mask)</text>
  <text x="140" y="321" class="note">PiXY: overlay centroids/boundaries</text>

  <!-- Step 3: Pick fiducial points -->
  <rect x="70" y="355" width="500" height="135" class="box" />
  <rect x="90" y="375" width="34" height="34" class="step" rx="8" />
  <text x="107" y="398" text-anchor="middle" class="stepText">3</text>
  <text x="140" y="387" class="title">Add fiducial points</text>
  <text x="140" y="413" class="text">Pick distinctive features on image</text>
  <text x="140" y="438" class="note">≥ 3 points (recommended 5) near periphery</text>
  <text x="140" y="463" class="note">PiXY: “Add Fiducial Point”</text>

  <!-- Stage lane: Measure stage coords -->
  <rect x="710" y="100" width="500" height="120" class="box" />
  <text x="730" y="135" class="title">Measure stage coordinates</text>
  <text x="730" y="161" class="text">(X, Y, Z) for each fiducial point</text>
  <text x="730" y="186" class="note">Read from instrument stage while centering the same feature</text>

  <!-- Step 4: Fit transform -->
  <rect x="710" y="245" width="500" height="120" class="box" />
  <rect x="730" y="265" width="34" height="34" class="step" rx="8" />
  <text x="747" y="288" text-anchor="middle" class="stepText">4</text>
  <text x="780" y="277" class="title">Fit 2D→3D affine transform</text>
  <text x="780" y="303" class="text">Least squares from fiducial pairs</text>
  <text x="780" y="327" class="note">Inspect residuals; adjust rotation/flip if needed</text>

  <!-- Step 5: Export -->
  <rect x="710" y="390" width="500" height="100" class="box" />
  <rect x="730" y="410" width="34" height="34" class="step" rx="8" />
  <text x="747" y="433" text-anchor="middle" class="stepText">5</text>
  <text x="780" y="422" class="title">Export target list</text>
  <text x="780" y="448" class="text">Targets: (X, Y, Z) for each centroid</text>
  <text x="780" y="472" class="note">CSV / Clipboard → instrument software</text>

  <!-- Core mapping callout between lanes -->
  <path d="M 570 270 L 710 270" class="arrow" />
  <path d="M 470 425 L 710 425" class="arrow" />
  <path d="M 570 155 L 710 155" class="arrow" />

  <rect x="485" y="12" width="310" height="48" class="box" />
  <text x="500" y="38" class="mono">(X,Y,Z) = A · (u,v,1)  (affine)</text>
  <text x="500" y="56" class="note">A estimated from fiducial points</text>
</svg>
