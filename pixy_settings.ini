# PiXY Settings Configuration File
# このファイルで Aggressiveness プリセット値と UI デフォルト設定を定義します。
# パラメータ値を調整する際は、このファイルを編集してアプリケーションを再起動してください。

[Aggressiveness]
# Format: trim, neck_separation, shape_complexity
# Aggressiveness レベル 0-10 に対応する 3 パラメータの組み合わせを定義

preset_0  = 0, 0, 3
preset_1  = 1, 0, 3
preset_2  = 2, 1, 3
preset_3  = 3, 1, 4
preset_4  = 4, 2, 4
preset_5  = 5, 3, 5
preset_6  = 6, 4, 5
preset_7  = 7, 5, 6
preset_8  = 8, 6, 7
preset_9  = 9, 7, 8
preset_10 = 10, 8, 9

[UI]
# UI のデフォルト設定

# 新規プロジェクト作成時の Aggressiveness レベル (0-10)
default_aggressiveness = 5

# 統合制御モード（Unified Control）を初期状態で有効にするか
# True: Aggressiveness スライダーで 3 パラメータを一括制御
# False: Boundary Offset, Neck Separation, Shape Complexity を個別に制御
unified_control_default = True
