[project]
name = "pixy"
version = "1.5.2"
description = "PiXY: Centroid Finder GUI for image-based centroid extraction"
authors = [{name = "Yoshiaki KON"}]
licenses = [{file = "LICENSE"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "opencv-python",
    "PySide6"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"


